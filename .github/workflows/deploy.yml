name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-convex:
    name: Deploy Convex
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set deploy key
        run: |
          if [[ "$BRANCH" == "main" ]]; then
            echo "CONVEX_DEPLOY_KEY=$PROD_KEY" >> "$GITHUB_ENV"
          else
            echo "CONVEX_DEPLOY_KEY=$DEV_KEY" >> "$GITHUB_ENV"
          fi
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PROD_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}
          DEV_KEY: ${{ secrets.CONVEX_DEV_DEPLOY_KEY }}

      - name: Deploy Convex
        working-directory: packages/backend
        run: npx convex deploy

      - name: Backfill Early Adopter grants
        working-directory: packages/backend
        run: npx convex run migrateEarlyAdopters:runGrantEarlyAdopters

  notify-failure:
    name: CI failed - skip deploy
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Log warning
        run: |
          echo "::warning::CI workflow failed on ${{ github.event.workflow_run.head_branch }} - skipping deployment"
