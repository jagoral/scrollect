name: CI

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run oxlint

      - name: Format check
        run: bun run oxfmt --check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun turbo run test

  deploy-preview:
    name: Deploy Convex Preview
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.convex-preview.outputs.preview_url }}
      preview_site_url: ${{ steps.convex-preview.outputs.preview_site_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Convex preview
        id: convex-preview
        uses: ./.github/actions/deploy-convex-preview
        with:
          preview-name: e2e-${{ github.run_id }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

      - name: Set preview env vars
        run: |
          cd packages/backend
          bunx convex env set USE_STUB_EXTRACTORS true --preview-name "e2e-${{ github.run_id }}"
          bunx convex env set OPENAI_API_KEY "$OPENAI_API_KEY" --preview-name "e2e-${{ github.run_id }}"
          bunx convex env set QDRANT_URL "$QDRANT_URL" --preview-name "e2e-${{ github.run_id }}"
          bunx convex env set QDRANT_API_KEY "$QDRANT_API_KEY" --preview-name "e2e-${{ github.run_id }}"
          bunx convex env set BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET" --preview-name "e2e-${{ github.run_id }}"
          bunx convex env set SITE_URL http://localhost:3000 --preview-name "e2e-${{ github.run_id }}"
          bunx convex env set ENABLE_E2E_ROUTES true --preview-name "e2e-${{ github.run_id }}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  e2e-build:
    name: E2E Build & Seed
    runs-on: ubuntu-latest
    needs: deploy-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun turbo run build
        env:
          VITE_CONVEX_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          VITE_CONVEX_SITE_URL: ${{ needs.deploy-preview.outputs.preview_site_url }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.output/
          retention-days: 1

  e2e-seeded:
    name: E2E Seeded Tests
    runs-on: ubuntu-latest
    needs: [e2e-build, deploy-preview]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/.output/

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: npx playwright install chromium --with-deps

      - name: Run app
        working-directory: apps/web
        run: bun run start &
        env:
          VITE_CONVEX_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          VITE_CONVEX_SITE_URL: ${{ needs.deploy-preview.outputs.preview_site_url }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}

      - name: Run seeded E2E tests
        working-directory: apps/e2e
        run: npx playwright test --project=seeded
        env:
          VITE_CONVEX_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          VITE_CONVEX_SITE_URL: ${{ needs.deploy-preview.outputs.preview_site_url }}

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-seeded
          path: apps/e2e/playwright-report/
          retention-days: 30

  e2e-chromium:
    name: E2E Chromium Tests
    runs-on: ubuntu-latest
    needs: [e2e-build, deploy-preview]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/.output/

      - name: Install Playwright browsers
        working-directory: apps/e2e
        run: npx playwright install chromium --with-deps

      - name: Run app
        working-directory: apps/web
        run: bun run start &
        env:
          VITE_CONVEX_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          VITE_CONVEX_SITE_URL: ${{ needs.deploy-preview.outputs.preview_site_url }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}

      - name: Run chromium E2E tests
        working-directory: apps/e2e
        run: npx playwright test --project=chromium
        env:
          VITE_CONVEX_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          VITE_CONVEX_SITE_URL: ${{ needs.deploy-preview.outputs.preview_site_url }}

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-chromium
          path: apps/e2e/playwright-report/
          retention-days: 30

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: deploy-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun turbo run build
        env:
          VITE_CONVEX_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          VITE_CONVEX_SITE_URL: ${{ needs.deploy-preview.outputs.preview_site_url }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}

      - name: Run app
        working-directory: apps/web
        run: bun run start &
        env:
          VITE_CONVEX_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          VITE_CONVEX_SITE_URL: ${{ needs.deploy-preview.outputs.preview_site_url }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}

      - name: Lighthouse CI
        run: bunx @lhci/cli autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
